<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo 博客</title>
    <!-- 使用 marked.js 渲染 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #f8f9fb;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #6b7a8d;
            --text-light: #95a5a6;
            --accent: #4a6cf7;
            --accent-hover: #3a5ce5;
            --accent-light: #eef1fe;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --danger-light: #fdecea;
            --border: #e8ecf1;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --mono: 'SF Mono', 'Consolas', 'Monaco', 'Menlo', monospace;
            --nav-height: 64px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            position: sticky;
            top: 0;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .navbar-inner {
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { font-size: 1.3rem; font-weight: 700; cursor: pointer; }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 4px; list-style: none; }
        .nav-links a {
            padding: 8px 14px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
            background: var(--accent-light);
        }
        .main {
            max-width: 900px;
            margin: 32px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }
        .page-header h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
        .page-header .subtitle { color: var(--text-light); font-size: 0.95rem; }
        .article-list { display: flex; flex-direction: column; gap: 16px; }
        .article-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid transparent;
        }
        .article-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--border);
            transform: translateY(-2px);
        }
        .article-card .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .category-tag {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--accent-light);
            color: var(--accent);
        }
        .date, .read-time { color: var(--text-light); font-size: 0.82rem; }
        .article-card h2 { font-size: 1.25rem; font-weight: 650; margin-bottom: 8px; }
        .article-card .excerpt { color: var(--text-secondary); font-size: 0.92rem; }
        .article-detail {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px 36px;
            box-shadow: var(--shadow);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .back-btn:hover { color: var(--accent); }
        .article-detail h1 { font-size: 1.8rem; margin-bottom: 20px; }
        .article-detail .content p { margin-bottom: 18px; }
        .article-detail .content h2 { margin: 28px 0 14px; }
        .article-detail .content pre {
            background: #1e2430;
            color: #e6e8ee;
            padding: 16px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin-bottom: 20px;
        }
        .article-detail .content code {
            font-family: var(--mono);
            background: #f0f2f5;
            padding: 2px 6px;
            border-radius: 4px;
            color: #e74c3c;
        }
        .article-detail .content blockquote {
            border-left: 4px solid var(--accent);
            padding: 12px 20px;
            background: var(--accent-light);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-style: italic;
        }
        .categories-grid { display: flex; flex-direction: column; gap: 24px; }
        .category-section h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-section .count { font-size: 0.8rem; color: var(--text-light); background: var(--bg); padding: 2px 10px; border-radius: 20px; }
        .cat-article-item {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            box-shadow: var(--shadow);
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cat-article-item:hover { transform: translateX(4px); box-shadow: var(--shadow-hover); }
        .cat-article-item .date { font-size: 0.8rem; }
        .about-card { text-align: center; }
        .avatar {
            width: 96px; height: 96px; border-radius: 50%;
            background: var(--accent-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: 700; color: var(--accent);
            margin: 0 auto 18px;
        }
        .contact-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
        .contact-links a {
            padding: 10px 20px; border-radius: 24px;
            text-decoration: none; font-weight: 550; font-size: 0.88rem;
            border: 1px solid var(--border); color: var(--text);
            transition: 0.2s;
        }
        .contact-links a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
        .login-view {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card h2 { margin-bottom: 8px; }
        .login-card p { color: var(--text-secondary); margin-bottom: 20px; }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 2px;
        }
        .login-card input:focus { outline: none; border-color: var(--accent); }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
            background: var(--accent);
            color: white;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }
        .admin-section { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
        @media (max-width: 700px) { .admin-section { grid-template-columns: 1fr; } }
        .admin-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .admin-card h2 { font-size: 1.2rem; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 6px; font-family: var(--font); font-size: 0.9rem;
        }
        .form-group textarea { min-height: 150px; font-family: var(--mono); }
        .admin-article-list { max-height: 400px; overflow-y: auto; }
        .admin-article-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px;
        }
        .admin-article-item .title { font-weight: 600; font-size: 0.9rem; }
        .delete-btn {
            background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger);
            padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
            transition: 0.2s;
        }
        .delete-btn:hover { background: var(--danger); color: white; }
        .preview-area {
            background: #fafbfc; border: 1px solid var(--border); border-radius: 6px;
            padding: 12px; min-height: 100px; margin-top: 10px; font-size: 0.9rem;
        }
        .footer { text-align: center; padding: 20px; border-top: 1px solid var(--border); color: var(--text-light); font-size: 0.82rem; }
        .hidden { display: none !important; }
        .success-hint {
            display: inline-block; background: #2ecc71; color: white; padding: 4px 12px;
            border-radius: 4px; font-size: 0.8rem; margin-left: 10px; opacity: 0; transition: opacity 0.3s;
        }
        .success-hint.show { opacity: 1; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-inner">
            <div class="logo" onclick="showPage('home')">Leo<span>Blog</span></div>
            <ul class="nav-links">
                <li><a data-page="home" class="active">首页</a></li>
                <li><a data-page="categories">分类</a></li>
                <li><a data-page="about">关于</a></li>
                <li><a id="admin-link" data-page="admin">管理</a></li>
                <li><a id="logout-link" style="display:none;" onclick="logout()">退出</a></li>
            </ul>
        </div>
    </nav>

    <div class="main" id="main-content"></div>

    <footer class="footer">
        <div>© 2025 Leo Zhou Yuan · 用 ❤️ 写作</div>
    </footer>

    <div id="login-modal" class="login-view hidden">
        <div class="login-card">
            <h2>🔐 管理登录</h2>
            <p>请输入管理密码以进入管理面板</p>
            <!-- 修改点1：添加 autocomplete="new-password" 防止自动填充 -->
            <input type="password" id="password-input" placeholder="密码" autocomplete="new-password" autofocus>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="btn" id="login-btn">登录</button>
                <button class="btn btn-outline" id="cancel-login-btn">取消</button>
            </div>
            <p id="login-error" style="color: var(--danger); margin-top: 12px; font-size: 0.9rem;"></p>
        </div>
    </div>

    <script>
        const API_BASE = '';

        let articles = [];
        let currentPage = 'home';
        let currentArticleId = null;
        let isLoggedIn = false;

        const mainContent = document.getElementById('main-content');
        const loginModal = document.getElementById('login-modal');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const cancelLoginBtn = document.getElementById('cancel-login-btn');
        const loginError = document.getElementById('login-error');
        const adminLink = document.getElementById('admin-link');
        const logoutLink = document.getElementById('logout-link');
        const navLinks = document.querySelectorAll('.nav-links a');

        document.addEventListener('DOMContentLoaded', () => {
            fetchArticles();
            showPage('home');
        });

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                const page = link.getAttribute('data-page');
                if (page) {
                    if (page === 'admin') {
                        if (!isLoggedIn) {
                            openLoginModal();
                        } else {
                            showPage('admin');
                        }
                    } else {
                        showPage(page);
                    }
                }
            });
        });

        function setActiveNav(page) {
            navLinks.forEach(a => a.classList.remove('active'));
            document.querySelector(`.nav-links a[data-page="${page}"]`)?.classList.add('active');
        }

        function showPage(page) {
            currentPage = page;
            currentArticleId = null;
            setActiveNav(page);
            switch (page) {
                case 'home': renderHome(); break;
                case 'categories': renderCategories(); break;
                case 'about': renderAbout(); break;
                case 'admin': renderAdmin(); break;
                default: renderHome();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function fetchArticles() {
            try {
                const res = await fetch(`${API_BASE}/api/articles`);
                if (!res.ok) throw new Error('获取文章失败');
                articles = await res.json();
            } catch (err) {
                console.error('获取文章出错：', err);
                articles = [];
            }
            if (currentPage === 'home' || currentPage === 'categories') {
                showPage(currentPage);
            }
        }

        function renderHome() {
            const articleCards = articles.map(a => `
                <!-- 修改点2：ID加单引号，兼容字符串ID -->
                <div class="article-card" onclick="openArticle('${a.id}')">
                    <div class="meta">
                        <span class="category-tag">${escapeHtml(a.category)}</span>
                        <span class="date">${a.date}</span>
                        <span class="read-time">${a.readTime}</span>
                    </div>
                    <h2>${escapeHtml(a.title)}</h2>
                    <p class="excerpt">${escapeHtml(a.excerpt)}</p>
                </div>
            `).join('');
            mainContent.innerHTML = `
                <div class="page-header">
                    <h1>最新文章</h1>
                    <p class="subtitle">共 ${articles.length} 篇文章 · 持续更新中</p>
                </div>
                <div class="article-list">${articleCards || '<p>暂无文章</p>'}</div>
            `;
        }

        function openArticle(id) {
            currentPage = 'article';
            currentArticleId = id;
            setActiveNav('home');
            renderArticle(id);
        }

        function renderArticle(id) {
            // 修改点3：使用宽松比较 ==，兼容数字和字符串
            const article = articles.find(a => a.id == id);
            if (!article) {
                mainContent.innerHTML = '<p>文章不存在或已删除</p>';
                return;
            }
            mainContent.innerHTML = `
                <div class="article-detail">
                    <button class="back-btn" onclick="showPage('home')">← 返回首页</button>
                    <div class="meta">
                        <span class="category-tag">${escapeHtml(article.category)}</span>
                        <span class="date">${article.date}</span>
                        <span class="read-time">阅读约 ${article.readTime}</span>
                    </div>
                    <h1>${escapeHtml(article.title)}</h1>
                    <div class="content">${article.content}</div>
                </div>
            `;
        }

        function renderCategories() {
            const cats = [...new Set(articles.map(a => a.category))];
            const catSections = cats.map(cat => {
                const catArticles = articles.filter(a => a.category === cat);
                const items = catArticles.map(a => `
                    <!-- 修改点4：同样加单引号 -->
                    <div class="cat-article-item" onclick="openArticle('${a.id}')">
                        <span>${escapeHtml(a.title)}</span>
                        <span class="date">${a.date}</span>
                    </div>
                `).join('');
                return `
                    <div class="category-section">
                        <h3>${escapeHtml(cat)} <span class="count">${catArticles.length} 篇</span></h3>
                        ${items}
                    </div>
                `;
            }).join('');
            mainContent.innerHTML = `
                <div class="page-header">
                    <h1>文章分类</h1>
                    <p class="subtitle">按分类浏览所有文章</p>
                </div>
                <div class="categories-grid">${catSections || '<p>暂无分类</p>'}</div>
            `;
        }

        function renderAbout() {
            mainContent.innerHTML = `
                <div class="about-card">
                    <div class="avatar">L</div>
                    <h1>Leo Zhou Yuan</h1>
                    <p>开发者 · 终身学习者 · 技术爱好者</p>
                    <p style="max-width:560px;margin:20px auto;color:var(--text-secondary);">
                        你好！我是 Leo，一名热爱技术的开发者。这个博客是我记录学习、分享经验的个人空间。
                    </p>
                    <div class="contact-links">
                        <a href="https://github.com/leozhouyuan/" target="_blank">GitHub</a>
                        <a href="mailto:leozhouyuan@outlook.com">Email</a>
                    </div>
                </div>
            `;
        }

        function renderAdmin() {
            if (!isLoggedIn) {
                openLoginModal();
                return;
            }
            const addForm = `
                <div class="admin-card">
                    <h2>📝 添加新文章</h2>
                    <div class="form-group">
                        <label>标题 *</label>
                        <input type="text" id="new-title" placeholder="文章标题">
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                        <div class="form-group">
                            <label>分类 *</label>
                            <select id="new-category">
                                <option value="技术分享">技术分享</option>
                                <option value="学习笔记">学习笔记</option>
                                <option value="生活随笔">生活随笔</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>日期 *</label>
                            <input type="date" id="new-date" value="${new Date().toISOString().slice(0,10)}">
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                        <div class="form-group">
                            <label>阅读时长 *</label>
                            <input type="text" id="new-readtime" value="5 分钟">
                        </div>
                        <div class="form-group">
                            <label>摘要 *</label>
                            <input type="text" id="new-excerpt" placeholder="简短描述">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>正文 (Markdown) *</label>
                        <textarea id="new-content" placeholder="在此输入 Markdown 内容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>预览</label>
                        <div class="preview-area" id="new-preview">预览将显示在这里...</div>
                    </div>
                    <button class="btn" id="add-article-btn">添加文章</button>
                </div>
            `;

            const deleteList = articles.map((a, index) => `
                <div class="admin-article-item">
                    <span class="title">${escapeHtml(a.title)}</span>
                    <button class="delete-btn" onclick="deleteArticle(${index})">删除</button>
                </div>
            `).join('') || '<p style="color:#aaa;">暂无文章</p>';

            mainContent.innerHTML = `
                <div class="page-header" style="margin-bottom:24px;">
                    <h1>文章管理</h1>
                    <p class="subtitle">添加或删除博客文章</p>
                </div>
                <div class="admin-section">
                    ${addForm}
                    <div class="admin-card">
                        <h2>🗑️ 删除文章</h2>
                        <div class="admin-article-list">${deleteList}</div>
                    </div>
                </div>
            `;

            const contentInput = document.getElementById('new-content');
            const previewDiv = document.getElementById('new-preview');
            contentInput.addEventListener('input', () => {
                const md = contentInput.value;
                if (md.trim()) previewDiv.innerHTML = marked.parse(md);
                else previewDiv.innerHTML = '预览将显示在这里...';
            });

            document.getElementById('add-article-btn').addEventListener('click', addArticle);
        }

        async function addArticle() {
            const title = document.getElementById('new-title').value.trim();
            const category = document.getElementById('new-category').value;
            const date = document.getElementById('new-date').value;
            const readTime = document.getElementById('new-readtime').value.trim() || '5 分钟';
            const excerpt = document.getElementById('new-excerpt').value.trim();
            const markdown = document.getElementById('new-content').value.trim();

            if (!title || !date || !excerpt || !markdown) {
                alert('请填写所有必填字段');
                return;
            }

            const contentHTML = marked.parse(markdown);

            try {
                const res = await fetch(`${API_BASE}/api/articles`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ title, category, date, readTime, excerpt, content: contentHTML })
                });

                if (res.ok) {
                    alert('文章添加成功！');
                    await fetchArticles();
                    showPage('home');
                } else {
                    const err = await res.json();
                    if (res.status === 401) {
                        alert('登录已过期，请重新登录');
                        isLoggedIn = false;
                        updateAuthUI();
                        openLoginModal();
                    } else {
                        alert(err.error || '添加失败');
                    }
                }
            } catch (err) {
                alert('无法连接服务器，请确保后端已启动');
            }
        }

        async function deleteArticle(index) {
            const article = articles[index];
            if (!confirm(`确定要删除文章《${article.title}》吗？`)) return;
            try {
                const res = await fetch(`${API_BASE}/api/articles/${article.id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (res.ok) {
                    alert('文章已删除');
                    await fetchArticles();
                    renderAdmin();
                } else {
                    const err = await res.json();
                    if (res.status === 401) {
                        alert('登录已过期，请重新登录');
                        isLoggedIn = false;
                        updateAuthUI();
                        openLoginModal();
                    } else {
                        alert(err.error || '删除失败');
                    }
                }
            } catch (err) {
                alert('无法连接服务器');
            }
        }

        function openLoginModal() {
            loginModal.classList.remove('hidden');
            // 修改点5：打开登录框时清空密码
            passwordInput.value = '';
            passwordInput.focus();
            loginError.textContent = '';
        }

        function closeLoginModal() {
            loginModal.classList.add('hidden');
            passwordInput.value = '';
            loginError.textContent = '';
        }

        loginBtn.addEventListener('click', doLogin);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
        cancelLoginBtn.addEventListener('click', closeLoginModal);

        async function doLogin() {
            const password = passwordInput.value.trim();
            if (!password) {
                loginError.textContent = '请输入密码';
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    isLoggedIn = true;
                    updateAuthUI();
                    closeLoginModal();
                    showPage('admin');
                } else {
                    loginError.textContent = data.error || '密码错误';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (err) {
                loginError.textContent = '无法连接服务器';
            }
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/api/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (e) {}
            isLoggedIn = false;
            updateAuthUI();
            showPage('home');
        }

        function updateAuthUI() {
            if (isLoggedIn) {
                adminLink.style.display = 'none';
                logoutLink.style.display = 'inline';
            } else {
                adminLink.style.display = 'inline';
                logoutLink.style.display = 'none';
            }
        }

        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) closeLoginModal();
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        updateAuthUI();
    </script>
</body>
</html>
